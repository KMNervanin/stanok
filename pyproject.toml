[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "mypy>=1.13", "types-jsonschema>=4.22"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages"]
# the long fuzzing sweep is deselected by default; run it with `uv run pytest -m slow`
addopts = "-q -m 'not slow'"
markers = ["slow: long-running property sweeps, not part of the default run"]
